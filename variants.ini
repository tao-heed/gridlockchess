# Gridlock Chess — Fairy-Stockfish custom variant definition.
#
# This variant is standard 8x8 chess PLUS three compound pieces that model the
# Gridlock "lattice" nodes whose movement is a union of standard pieces:
#
#   a = archbishop (BN)  → Leap + Diagonal    (Knight + Bishop)
#   c = chancellor (RN)  → Leap + Orthogonal  (Knight + Rook)
#   m = amazon     (QN)  → Leap + Ortho + Diag (Queen + Knight)
#
# The single-vector nodes (Knight=n, Bishop=b, Rook=r) and the Queen node (q)
# already exist in standard chess and need no definition here.
#
# Dead Pieces (gridlocked, 0/0/0) are encoded by engine.ts as the built-in `immobile` piece
# `x` — it blocks squares, is auto-valued low (no mobility), and being NON-royal makes a dead
# PILOTED anomaly trigger extinction=loss (Gridlock Death). The client still re-filters every
# engine move through the real rules, so a Dead Piece can never actually be moved.
#
# Loaded at runtime via:  setoption name VariantPath value variants.ini
# then:                   setoption name UCI_Variant value gridlock

[gridlock:chess]
archbishop = a
chancellor = c
amazon = m
immobile = x
promotionPieceTypes = nbrqacm
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1

# =====================================================================================
# [gridlock-royal:chess] — depletion-aware royal Piloted Anomaly (VALIDATED).
#
# Same as [gridlock:chess] PLUS 7 custom ROYAL piece types. A Piloted Anomaly (the King
# boarded it via Override) is royal, and its CURRENT reach is exactly one union of its
# live vectors {Orthogonal, Diagonal, Leap}. engine.ts emits the matching letter each
# turn, so the engine sees the royal's true shape instead of a 1-square king.
#
#   O D L | piece       | Betza | letter
#   ------+-------------+-------+-------
#   1 1 1 | amazon (QN) | QN    | e
#   0 1 1 | archbishop  | BN    | f
#   1 0 1 | chancellor  | RN    | g
#   1 1 0 | queen       | Q     | h
#   0 0 1 | knight      | N     | i
#   0 1 0 | bishop      | B     | j
#   1 0 0 | rook        | R     | s
#   0 0 0 | (dead)      | —     | x (immobile, non-royal) → extinction → loss (Gridlock Death)
#
# The 7 letters are custom (not q/r/b/n/m/a/c) so ONLY the piloted piece is royal — reusing
# standard letters would wrongly make the opponent's queen and both sides' non-piloted
# anomalies royal. 'k' stays in the royal set because before Override the royal is a normal
# king. Validated live by the vitest suite (engine.spec.ts, 6/6: movement + royalty + parse).
# =====================================================================================
[gridlock-royal:chess]
archbishop = a
chancellor = c
amazon = m
immobile = x
customPiece1 = e:QN
customPiece2 = f:BN
customPiece3 = g:RN
customPiece4 = h:Q
customPiece5 = i:N
customPiece6 = j:B
customPiece7 = s:R
extinctionValue = loss
extinctionPseudoRoyal = true
extinctionPieceTypes = kefghijs
hasFuel = true
promotionPieceTypes = m
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1

