<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gridlock" />
    <title>Gridlock Chess</title>
    <!-- Pre-mount splash: visible before React hydrates, removed by App on first render -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #070a12;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.5rem;
      }
      #splash img { width: min(200px, 45vw); height: auto; }
      #splash p { color: #22e0ff; font-family: system-ui, sans-serif;
                  font-size: 0.875rem; letter-spacing: 0.15em; opacity: 0.7; }
      #root:not(:empty) ~ #splash,
      #root:not(:empty) + #splash { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash removed by React once #root has content -->
    <div id="splash" aria-hidden="true">
      <img src="/pwa-192x192.png" alt="" />
      <p>GRIDLOCK CHESS</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
